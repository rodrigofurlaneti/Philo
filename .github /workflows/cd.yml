name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: philo-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      APP: philo
      API_SERVICE: philo-api.service
      # TODO: confirmar o nome real do assembly publicado (ex.: Philo.Api.dll)
      API_ENTRY_FILE: Philo.Api.dll
      API_PORT: "5301"
      FRONTEND_PORT: "8300"
      PUBLIC_API_PORT: "8301"
      API_HEALTH_PATH: "/health"
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}

    steps:
      - name: Validar configuracao
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$API_HEALTH_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]]; then
            echo '::error::Configure API_HEALTH_PATH com a rota real de saude da API (resposta HTTP 2xx).'
            exit 1
          fi
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.@-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$SSH_PORT > 0 && 10#$SSH_PORT < 65536 ))
          [[ "$API_SERVICE" =~ ^[a-zA-Z0-9_.@-]+\.service$ && "$API_SERVICE" != -* ]]
          [[ "$API_ENTRY_FILE" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]]

      - uses: actions/download-artifact@v6
        with:
          name: philo-api
          path: backend-publish
      - uses: actions/download-artifact@v6
        with:
          name: philo-frontend
          path: frontend-build

      - name: Configurar conexao SSH verificada
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf 'Host production-vm\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 15\n' "$SSH_HOST" "$SSH_USER" "$SSH_PORT" > "$HOME/.ssh/config"

      - name: Prepare deployment
        shell: bash
        run: |
          set -euo pipefail
          test -s "backend-publish/$API_ENTRY_FILE"
          test -s frontend-build/index.html
          # Production configuration and persistent data must be mapped through shared.
          # Configuracao e dados persistentes ficam em shared; nao criar backups.
          tar -czf backend.tar.gz -C backend-publish .
          tar -czf frontend.tar.gz -C frontend-build .
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n --arg release "$RELEASE" --arg service "$API_SERVICE" \
            --arg api "http://127.0.0.1:$API_PORT$API_HEALTH_PATH" --arg frontend "http://127.0.0.1:$FRONTEND_PORT/" --arg assembly "$API_ENTRY_FILE" \
            --arg app "$APP" --arg public_api "http://127.0.0.1:$PUBLIC_API_PORT$API_HEALTH_PATH" \
            '{release:$release,service:$service,api:$api,frontend:$frontend,assembly:$assembly,app:$app,public_api:$public_api}' > deploy-config.json
          cat > deploy.sh <<'BASH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          stage=$1
          [[ "$stage" =~ ^/tmp/webapp-deploy\.[a-zA-Z0-9]+$ ]]
          for command in jq curl flock nginx systemctl tar find readlink cmp; do
            command -v "$command" >/dev/null
          done
          app=$(jq -er .app "$stage/deploy-config.json")
          case "$app" in philo) ;; *) echo 'Projeto invalido'; exit 1 ;; esac
          exec 9>"/run/lock/$app-deploy.lock"
          flock -n 9 || { echo 'Outro deploy esta em andamento.'; exit 1; }
          api="/opt/$app-api"
          web="/var/www/$app"
          release=$(jq -er .release "$stage/deploy-config.json")
          service=$(jq -er .service "$stage/deploy-config.json")
          api_url=$(jq -er .api "$stage/deploy-config.json")
          web_url=$(jq -er .frontend "$stage/deploy-config.json")
          public_api_url=$(jq -er .public_api "$stage/deploy-config.json")
          trap 'echo "Falha na linha $LINENO. Confira migracao releases/current, configuracao systemd/Nginx e portas antes de repetir." >&2' ERR
          assembly=$(jq -er .assembly "$stage/deploy-config.json")
          [[ "$assembly" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]]
          executable=${assembly%.dll}
          [[ "$release" =~ ^[0-9]{14}-[0-9]+-[0-9]+$ ]]
          [[ "$service" =~ ^[a-zA-Z0-9_.@-]+\.service$ && "$service" != -* ]]
          [[ "$api_url" == http://* || "$api_url" == https://* ]]
          [[ "$web_url" == http://* || "$web_url" == https://* ]]
          for base in "$api" "$web"; do
            [[ -d "$base/releases" && ! -L "$base/releases" && -L "$base/current" ]]
            [[ "$(readlink -f "$base")" == "$base" ]]
            previous=$(readlink -f "$base/current")
            [[ "$previous" == "$base/releases/"* && -d "$previous" ]]
          done
          [[ -d "$api/shared" && ! -L "$api/shared" ]]
          old_api=$(readlink -f "$api/current")
          old_web=$(readlink -f "$web/current")
          [[ "$(systemctl show "$service" -p WorkingDirectory --value)" == "$api/current" ]]
          systemctl show "$service" -p ExecStart --value | grep -Fq "$api/current/"
          nginx -t
          nginx_config=$(nginx -T 2>&1)
          grep -Eq "root[[:space:]]+$web/current/?[[:space:]]*;" <<< "$nginx_config"
          test -s "$old_api/$assembly"
          test -s "$old_web/index.html"
          systemctl is-active --quiet "$service"

          check_url() {
            local code
            code=$(curl --silent --show-error --output /dev/null \
              --connect-timeout 5 --max-time 10 --write-out '%{http_code}' "$1") || return 1
            [[ "$code" =~ ^2[0-9][0-9]$ ]]
          }
          check_url "$api_url"
          check_url "$web_url"
          check_url "$public_api_url"
          new_api="$api/releases/$release"
          new_web="$web/releases/$release"
          [[ ! -e "$new_api" && ! -e "$new_web" ]]
          install -d -m 755 "$new_api" "$new_web"
          tar --no-same-owner -xzf "$stage/backend.tar.gz" -C "$new_api"
          tar --no-same-owner -xzf "$stage/frontend.tar.gz" -C "$new_web"
          # Reject links from artifacts; only explicit shared links are allowed.
          [[ -z "$(find "$new_api" "$new_web" -type l -print -quit)" ]]
          find "$new_api" "$new_web" -type d -exec chmod 755 {} +
          find "$new_api" "$new_web" -type f -exec chmod 644 {} +
          if [[ "$assembly" == *.dll && -f "$new_api/$executable" ]]; then chmod 755 "$new_api/$executable"; fi
          test -s "$new_api/$assembly"
          test -s "$new_web/index.html"
          # Map each top-level shared entry into the new API release.
          # The initial migration must put production config/uploads/data here.
          shopt -s dotglob nullglob
          for item in "$api/shared"/*; do
            name=${item##*/}
            case "$name" in
              "$executable"|*.dll|*.so|*.deps.json|*.runtimeconfig.json)
                echo "Entrada shared nao permitida: $name"; exit 1 ;;
            esac
            # Remove only a same-named item from this NEW, unpublished release.
            rm -rf -- "$new_api/$name"
            ln -s -- "$item" "$new_api/$name"
          done
          printf '%s\n' "$release" > "$new_web/deploy-version.txt"
          switched=0
          committed=0
          switch_link() {
            local base=$1 target=$2 temp
            temp="$base/.current-$release"
            ln -sfnT -- "$target" "$temp" || return 1
            mv -Tf -- "$temp" "$base/current" || return 1
          }
          finish() {
            status=$?
            trap - EXIT
            if (( status != 0 && switched == 1 && committed == 0 )); then
              echo 'Falha: restaurando os links anteriores.'
              set +e
              switch_link "$api" "$old_api"
              ra=$?
              switch_link "$web" "$old_web"
              rw=$?
              systemctl restart "$service"
              rs=$?
              if (( ra != 0 || rw != 0 || rs != 0 )); then
                echo 'ERRO: rollback incompleto; intervencao necessaria.'
              else
                echo 'Links restaurados e reinicio solicitado. Confira a saude da versao anterior.'
              fi
            fi
            exit "$status"
          }
          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          switched=1
          switch_link "$api" "$new_api"
          switch_link "$web" "$new_web"
          systemctl restart "$service"
          healthy=0
          for attempt in {1..12}; do
            if systemctl is-active --quiet "$service" && check_url "$api_url" && check_url "$web_url" && check_url "$public_api_url"; then
              if curl --fail --silent --show-error --max-time 10 "${web_url}index.html?deploy=$release" | cmp -s "$new_web/index.html" -; then
                healthy=1
                break
              fi
            fi
            sleep 5
          done
          (( healthy == 1 ))
          committed=1
          # No backups or historical releases: keep only the active release.
          # Cleanup runs only after the new application passes health checks.
          prune() {
            local base=$1 current path resolved
            current=$(readlink -f "$base/current")
            [[ "$current" == "$base/releases/$release" && -d "$current" ]] || return 1
            while IFS= read -r -d '' path; do
              [[ "$path" == "$current" ]] && continue
              resolved=$(readlink -f "$path")
              [[ "$resolved" == "$path" && "$path" == "$base/releases/"* && ! -L "$path" ]] || return 1
              rm -rf -- "$path" || return 1
            done < <(find "$base/releases" -mindepth 1 -maxdepth 1 -type d -print0)
          }
          prune "$api" || { echo 'ERRO: deploy ativo, mas limpeza da API incompleta.'; exit 1; }
          prune "$web" || { echo 'ERRO: deploy ativo, mas limpeza do frontend incompleta.'; exit 1; }
          echo "Deploy validado: $release"
          BASH
          bash -n deploy.sh

      - name: Publicar e validar
        shell: bash
        run: |
          set -euo pipefail
          stage=$(ssh production-vm 'mktemp -d /tmp/webapp-deploy.XXXXXXXXXX')
          [[ "$stage" =~ ^/tmp/webapp-deploy\.[a-zA-Z0-9]+$ ]]
          cleanup() { ssh production-vm "rm -f -- '$stage/backend.tar.gz' '$stage/frontend.tar.gz' '$stage/deploy.sh' '$stage/deploy-config.json'; rmdir -- '$stage'" || true; }
          trap cleanup EXIT
          scp backend.tar.gz frontend.tar.gz deploy.sh deploy-config.json "production-vm:$stage/"
          ssh production-vm "sudo -n bash '$stage/deploy.sh' '$stage'"
          echo "### $APP publicado e validado" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remover chave do runner
        if: always()
        shell: bash
        run: rm -f -- "$HOME/.ssh/deploy" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
